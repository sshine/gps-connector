name: Helm CI

on:
  push:
    paths:
      - "chart/**"
  pull_request:
    paths:
      - "chart/**"

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "3.17.0"

      # validates chart structure, required fields, and value schema
      - name: Lint
        run: helm lint ./chart

      # renders all templates with default values (mqtt.gateway.create=true)
      - name: Template (create gateway)
        run: |
          helm template gps-connector ./chart \
            --namespace gps-connector \
            --values ./chart/values-images.yaml

      # renders all templates with shared services (patchService triggers the hook Job)
      - name: Template (shared services)
        run: |
          helm template gps-connector ./chart \
            --namespace gps-connector \
            --values ./chart/values-images.yaml \
            --values ./chart/values-shared-services.yaml
