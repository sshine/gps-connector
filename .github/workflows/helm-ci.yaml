name: Helm CI

on:
  push:
    paths:
      - "chart/**"
  pull_request:
    paths:
      - "chart/**"

jobs:
  lint-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "3.17.0"

      # validates chart structure, required fields, and value schema
      - name: Lint
        run: helm lint ./chart

      # renders all templates with default values (mqtt.gateway.create=true), including secrets
      - name: Template (create gateway)
        run: |
          helm template gps-connector ./chart \
            --namespace gps-connector \
            --values ./chart/values-images.yaml \
            --set secretData.main.RABBITMQ_DEFAULT_USER=dummy \
            --set secretData.main.RABBITMQ_DEFAULT_PASS=dummy \
            --set secretData.main.MINIO_ROOT_USER=dummy \
            --set secretData.main.MINIO_ROOT_PASSWORD=dummy \
            --set secretData.main.SMTP_USER=dummy \
            --set secretData.main.SMTP_PASSWORD=dummy \
            --set secretData.rootCa."ca\.crt"=dummy \
            --set secretData.rabbitmqTls."ca\.crt"=dummy \
            --set secretData.rabbitmqTls."server\.crt"=dummy \
            --set secretData.rabbitmqTls."server\.key"=dummy

      # renders all templates with shared services (patchService triggers the hook Job)
      - name: Template (shared services)
        run: |
          helm template gps-connector ./chart \
            --namespace gps-connector \
            --values ./chart/values-images.yaml \
            --values ./chart/values-shared-services.yaml
