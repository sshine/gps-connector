apiVersion: batch/v1
kind: CronJob
metadata:
  name: cratedb-archiver
  labels:
    {{- include "gps-connector.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.archiver.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: archiver
              image: {{ .Values.images.archiver.repository }}:{{ .Values.images.archiver.tag }}
              env:
                - name: CRATE_HOST
                  value: cratedb
                - name: CRATE_PORT
                  value: "4200"
                - name: MINIO_ENDPOINT
                  value: http://minio:9000
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.main }}
                      key: MINIO_ROOT_USER
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.main }}
                      key: MINIO_ROOT_PASSWORD
                - name: ARCHIVE_BUCKET
                  value: {{ .Values.api.archiveBucket }}
                - name: ARCHIVE_AFTER_MINUTES
                  value: {{ .Values.archiver.archiveAfterMinutes | quote }}
                - name: DELETE_AFTER_MINUTES
                  value: {{ .Values.archiver.deleteAfterMinutes | quote }}
          restartPolicy: Never
