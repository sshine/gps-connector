apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "gps-connector.labels" . | nindent 4 }}
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: mqtt-tls
      port: 8883
      targetPort: 8883
    - name: management
      port: 15672
      targetPort: 15672
