apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: mqtt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gps-connector.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.mqtt.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: {{ .Values.mqtt.port }}
        name: mqtt-tls
        protocol: TLS
      tls:
        mode: PASSTHROUGH
      hosts:
        - "*"
