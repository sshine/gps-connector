{{- if not .Values.mqtt.gateway.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mqtt-gateway-patcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gps-connector.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-mqtt-gateway-patcher
  labels:
    {{- include "gps-connector.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: [{{ .Values.mqtt.gateway.patchService.name | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-mqtt-gateway-patcher
  labels:
    {{- include "gps-connector.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-mqtt-gateway-patcher
subjects:
  - kind: ServiceAccount
    name: mqtt-gateway-patcher
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mqtt-gateway-patcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gps-connector.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: mqtt-gateway-patcher
      restartPolicy: OnFailure
      containers:
        - name: patcher
          image: bitnami/kubectl:latest
          command:
            - kubectl
            - patch
            - svc
            - {{ .Values.mqtt.gateway.patchService.name }}
            - -n
            - {{ .Values.mqtt.gateway.patchService.namespace }}
            - --type=strategic
            - -p
            - |
              {"spec":{"ports":[{"name":"mqtt-tls","port":{{ .Values.mqtt.port }},"targetPort":{{ .Values.mqtt.port }},"protocol":"TCP"}]}}
{{- end }}
