apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    {{- include "gps-connector.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: {{ .Values.images.loki.repository }}:{{ .Values.images.loki.tag }}
          ports:
            - containerPort: 3100
          volumeMounts:
            - mountPath: /etc/loki/loki.yaml
              name: config
              subPath: loki.yaml
            - mountPath: /loki
              name: loki-data
          args: ["-config.file=/etc/loki/loki.yaml"]

      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: loki-data
          persistentVolumeClaim:
            claimName: loki-data
