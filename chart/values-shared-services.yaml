# Assumes the cluster runs Istio as its service mesh (tested against Istio 1.21).
# Uses the shared istio-ingressgateway; a post-install hook patches mqtt.port onto it.
# Requires cross-namespace RBAC to patch the service in mqtt.gateway.service.namespace.
# Other cluster-level dependencies (cert-manager, external-dns, storage classes,
# OIDC provider) are expected to be pre-installed and are not managed by this chart.
# Use alongside values-images.yaml for image references.
storage:
  cratedb: 1Gi
  loki: 1Gi
  minio: 5Gi
  mongodb: 1Gi
  rabbitmq: 5Gi
  redis: 256Mi

api:
  host: gps-connector-api.droidsagencyai.com
  oidcIssuerUrl: https://auth.droidsagencyai.com/realms/GPS-Connector-Test
  oidcClientId: gps-connector-api
  corsAllowedOrigins: "http://localhost:5173,http://localhost:3000,https://gps-connector.droidsagencyai.com"
  archiveBucket: gps-archive

grafana:
  smtp:
    host: smtp.office365.com:587
  alerting:
    email: daniel@droidsagency.com

archiver:
  schedule: "0 0,12 * * *"
  archiveAfterMinutes: 1440
  deleteAfterMinutes: 2880

mqtt:
  port: 8883
  gateway:
    # Skips deploying a gateway Deployment + Service; patches mqtt.port onto the
    # shared gateway service at service.namespace/service.name instead.
    create: false
    service:
      namespace: istio-system
      name: istio-ingressgateway
    selector:
      istio: ingressgateway

secrets:
  main: gps-connector-secrets
  rootCa: gps-connector-root-ca
  rabbitmqTls: rabbitmq-tls

# Optionally deploy secrets via Helm. Supply key/value pairs to create the
# corresponding Secret; omit to manage secrets out-of-band.
#   --set secretData.main.SOME_KEY=value
#   --set-file secretData.rootCa."ca\.crt"=/path/to/ca.crt
secretData:
  main: {}
  rootCa: {}
  rabbitmqTls: {}
