# Deploys a dedicated Istio ingress gateway (Deployment + Service) in mqtt.gateway.service.namespace.
# Requires Istio to be installed in the cluster with injection enabled in that namespace.
#
# Some cluster-level dependencies are expected to be pre-installed and are not managed by this chart:
# - cert-manager
# - external-dns
# - storage classes
# - OIDC provider
#
# Use alongside values-images.yaml for image references. See .github/workflows/helm-ci.yaml for example run.
storage:
  cratedb: 1Gi
  loki: 1Gi
  minio: 5Gi
  mongodb: 1Gi
  rabbitmq: 5Gi
  redis: 256Mi

api:
  host: gps-connector-api.droidsagencyai.com
  oidcIssuerUrl: https://auth.droidsagencyai.com/realms/GPS-Connector-Test
  oidcClientId: gps-connector-api
  corsAllowedOrigins: "http://localhost:5173,http://localhost:3000,https://gps-connector.droidsagencyai.com"
  archiveBucket: gps-archive

grafana:
  smtp:
    host: smtp.office365.com:587
  alerting:
    email: daniel@droidsagency.com

archiver:
  schedule: "0 0,12 * * *"
  archiveAfterMinutes: 1440
  deleteAfterMinutes: 2880

mqtt:
  port: 8883
  gateway:
    # Deploys a dedicated Istio gateway Deployment + Service + the Gateway resource.
    create: true
    service:
      namespace: gps-connector
      name: mqtt-gateway
    selector:
      app: mqtt-gateway

secrets:
  main: gps-connector-secrets
  rootCa: gps-connector-root-ca
  rabbitmqTls: rabbitmq-tls

# Optionally deploy secrets via Helm. Supply key/value pairs to create the
# corresponding Secret; omit to manage secrets out-of-band.
#   --set secretData.main.SOME_KEY=value
#   --set-file secretData.rootCa."ca\.crt"=/path/to/ca.crt
secretData:
  main: {}
  rootCa: {}
  rabbitmqTls: {}
